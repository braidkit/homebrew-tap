name: Audit casks

# Casks here are generated by GoReleaser in braidkit/braid and pushed on a
# stable tag. Nobody edits them by hand, so a generator change reaches users
# unreviewed, and this job is what inspects it.
#
# It reports; it does not gate. GoReleaser pushes straight to this branch, so
# by the time a push run starts, `brew install --cask` can already resolve the
# cask. A red run here means a bad cask is already live and needs reverting,
# not that one was held back.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # macOS runners ship Homebrew, and a cask cannot be audited without it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # brew audit resolves casks by tap name, so the checkout has to land
          # where Homebrew looks for taps rather than in the default workspace.
          path: Taps/braidkit/homebrew-tap

      - name: Audit every cask
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/braidkit/homebrew-tap"
          mkdir -p "$(dirname "${tap_dir}")"
          ln -s "${GITHUB_WORKSPACE}/Taps/braidkit/homebrew-tap" "${tap_dir}"

          shopt -s nullglob
          casks=("${tap_dir}"/Casks/*.rb)
          # Empty until the first stable tag pushes a cask here. That is the
          # documented state of this tap, not a failure, so main stays green.
          if [ ${#casks[@]} -eq 0 ]; then
            echo "::notice::no cask published to this tap yet — nothing to audit"
            exit 0
          fi

          # --new is what makes this a real check rather than a syntax pass.
          # Without it `brew audit` never fetches the archive: a cask carrying a
          # wrong SHA-256, or a URL that 404s, exits 0 and looks healthy. --new
          # downloads each artifact, verifies its digest against the cask, and
          # runs the macOS signature check, which is the failure a generated
          # cask can actually reach users with.
          #
          # --skip-style drops only RuboCop layout rules. GoReleaser emits
          # on_intel before on_arm and its own argument alignment, and
          # hand-fixing a file headed DO NOT EDIT would be undone by the next
          # release.

          # One broken cask must not hide the rest. Under `set -e` an unchecked
          # `brew audit` would abort the run on the first failure, leave its
          # ::group:: unclosed, and never look at the casks after it — so a
          # second broken cask stays invisible until the first is fixed. Each
          # result is captured and the exit deferred, so one run reports every
          # cask that is broken. Accumulated as a string, not an array: under
          # `set -u`, expanding an empty array errors on the bash 3.2 that ships
          # with macOS.
          failed=""
          for cask in "${casks[@]}"; do
            name="$(basename "${cask}" .rb)"
            echo "::group::brew audit ${name}"
            if ! brew audit --cask --new --skip-style "braidkit/tap/${name}"; then
              failed="${failed} ${name}"
            fi
            echo "::endgroup::"
          done

          if [ -n "${failed}" ]; then
            echo "::error::brew audit failed for:${failed}"
            exit 1
          fi
