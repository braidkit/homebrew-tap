name: Audit casks

# Casks here are generated by GoReleaser in braidkit/braid and pushed on a
# stable tag. Nobody edits them by hand, so this workflow is the only thing
# standing between a bad generator change and `brew install --cask`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # macOS runners ship Homebrew, and a cask cannot be audited without it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # brew audit resolves casks by tap name, so the checkout has to land
          # where Homebrew looks for taps rather than in the default workspace.
          path: Taps/braidkit/homebrew-tap

      - name: Audit every cask
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/braidkit/homebrew-tap"
          mkdir -p "$(dirname "${tap_dir}")"
          ln -s "${GITHUB_WORKSPACE}/Taps/braidkit/homebrew-tap" "${tap_dir}"

          shopt -s nullglob
          casks=("${tap_dir}"/Casks/*.rb)
          # Empty until the first stable tag pushes a cask here. That is the
          # documented state of this tap, not a failure, so main stays green.
          if [ ${#casks[@]} -eq 0 ]; then
            echo "::notice::no cask published to this tap yet — nothing to audit"
            exit 0
          fi

          # --skip-style is not a waiver on correctness; it drops only RuboCop
          # layout rules. GoReleaser emits on_intel before on_arm and its own
          # argument alignment, and hand-fixing that would be overwritten by
          # the next release. Everything audit checks about the cask itself —
          # stanza validity, deprecated parameters, token/name agreement — runs.
          for cask in "${casks[@]}"; do
            name="$(basename "${cask}" .rb)"
            echo "::group::brew audit ${name}"
            brew audit --cask --skip-style "braidkit/tap/${name}"
            echo "::endgroup::"
          done
